<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Employee Table</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body{font-family:Arial,Helvetica,sans-serif;padding:20px}
      table{border-collapse:collapse;width:100%;max-width:800px}
      th,td{border:1px solid #ccc;padding:8px;text-align:left}
      th{background:#f5f5f5}
      .highlight{background:#ffe6e6}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const employees = [
        {id:1,name:'Alice Johnson',department:'Engineering',salary:72000},
        {id:2,name:'Bob Smith',department:'Sales',salary:48000},
        {id:3,name:'Carmen Lee',department:'HR',salary:51000},
        {id:4,name:'Daniel Kim',department:'Design',salary:45000},
        {id:5,name:'Eve Turner',department:'Engineering',salary:88000}
      ];
      function App(){
        return (
          <div>
            <h2>Employees</h2>
            <table>
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Name</th>
                  <th>Department</th>
                  <th>Salary</th>
                </tr>
              </thead>
              <tbody>
                {employees.map(emp=>(
                  <tr key={emp.id} className={emp.salary>50000?'highlight':''}>
                    <td>{emp.id}</td>
                    <td>{emp.name}</td>
                    <td>{emp.department}</td>
                    <td>{emp.salary.toLocaleString()}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App/>);
    </script>
  </body>
</html>
